<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable: the page itself must not pinch-zoom like a web
         page (the photo has its own zoom). iOS honors this when installed; in-browser
         Safari ignores it and is handled by the gesturestart guard in app.ts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <!-- FO Black. iOS standalone renders status text white over black-translucent,
         so the strip under the cutout must be dark — the brand's dark-first canvas
         satisfies that everywhere. -->
    <meta name="theme-color" content="#00080A" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Official FLEXOPTIX favicon (brand package logos/favicon-96.svg). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <!-- App-feel: launch chrome-less from the home-screen icon on iOS (Android
         reads display:standalone from the manifest instead). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Plate Reader</title>
  </head>
  <body>
    <div id="shell">
      <header id="topbar">
        <span id="brand">
          <!-- Official FLEXOPTIX eyecon (logos/eyecon-dark.svg — white mark for
               dark backgrounds), inlined verbatim. Never redrawn, never orange. -->
          <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M60.007 119.885C92.8914 119.885 119.507 93.2326 119.507 60.3848H119.544C119.544 27.537 92.9281 0.884766 60.0436 0.884766C27.1591 0.884766 0.54361 27.537 0.54361 60.3848C0.54361 93.2326 27.1225 119.885 60.007 119.885ZM81.4902 22.478L72.6183 49.9001L72.5817 49.9368L99.1606 41.3215C107.079 57.5621 104.293 77.7254 90.802 91.2165C73.7915 108.227 46.1861 108.227 29.1756 91.2165C12.1652 74.206 12.1652 46.6007 29.1756 29.5902C43.3633 15.4026 64.8463 13.0563 81.4902 22.478Z" fill="#FFFFFF"/>
          </svg>
          <h1>Plate Reader</h1>
        </span>
        <span id="app-build"></span>
      </header>
      <main id="content">
        <section id="photo-panel">
          <div id="busy" hidden aria-label="Working"><span class="spinner"></span></div>
          <canvas id="photo-canvas" hidden></canvas>
          <div id="photo-placeholder" class="empty-state">
            <p class="eyebrow">On-device ANPR</p>
            <h2>Scan a license plate</h2>
            <p>Photos are analyzed on this phone. Nothing leaves it.</p>
          </div>
        </section>
        <section id="plates-panel">
          <p id="status" role="status"></p>
          <div id="cards"></div>
          <p id="no-plate" class="hint" hidden>No plate read with certainty — try again closer.</p>
        </section>
      </main>
      <div id="action-bar">
        <label class="btn primary">
          Take photo
          <input id="camera-input" type="file" accept="image/*" capture="environment" />
        </label>
        <label class="btn secondary">
          Gallery
          <input id="gallery-input" type="file" accept="image/*" />
        </label>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
